function startNewSession(user, athleteId){
  const targetId = athleteId || (user.role === 'athlete' ? user.id : null);
  if (!targetId) { toast('Pilih atlet terlebih dahulu.'); return; }
  state.sessionDraft = {
    athleteId: targetId,
    editingId: null,
    date: todayISO(),
    entries: {},
    notes: '',
    returnView: user.role === 'coach' ? 'athlete' : 'home'
  };
  state.view = 'session';
  state.modal = null;
  render();
  scrollTop();
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const user = currentUser();

  if (action === 'auth-tab') {
    state.loginTab = el.dataset.tab === 'register' ? 'register' : 'login';
    renderAuth();
    return;
  }
  if (action === 'logout') {
    stopCloud();
    localStorage.removeItem(LS.auth);
    state.view = 'home';
    state.modal = null;
    state.sessionDraft = null;
    state.athleteId = null;
    state.loginTab = 'login';
    state.filters = { athleteId: '', from: '', to: '' };
    renderAuth();
    toast('Kamu sudah keluar.');
    return;
  }
  if (action === 'sync-info') {
    showCloudInfo();
    return;
  }
  if (!user) return;

  switch (action) {
    case 'nav': {
      const view = el.dataset.view;
      if (view === 'session') { startNewSession(user); return; }
      state.view = view;
      state.modal = null;
      state.sessionDraft = null;
      if (view !== 'athlete') state.athleteId = null;
      render();
      scrollTop();
      return;
    }
    case 'select-athlete': {
      if (user.role !== 'coach') return;
      state.view = 'athlete';
      state.athleteId = el.dataset.id;
      state.modal = null;
      render();
      scrollTop();
      return;
    }
    case 'open-session': {
      const s = getSessions().find(x => x.id === el.dataset.id);
      if (!s) { toast('Sesi tidak ditemukan.'); return; }
      const allowed = user.role === 'coach'
        ? (getUserById(s.athleteId) || {}).coachId === user.id
        : s.athleteId === user.id;
      if (!allowed) { toast('Kamu tidak punya akses ke sesi ini.'); return; }
      state.modal = { type: 'session', id: s.id };
      renderModal();
      return;
    }
    case 'close-modal':
      closeModal();
      return;
    case 'close-modal-bg':
      if (e.target === el) closeModal();
      return;
    case 'new-session':
      startNewSession(user, el.dataset.athlete);
      return;
    case 'edit-session': {
      const s = getSessions().find(x => x.id === el.dataset.id);
      if (!s) return;
      const allowed = user.role === 'coach'
        ? (getUserById(s.athleteId) || {}).coachId === user.id
        : s.athleteId === user.id;
      if (!allowed) { toast('Kamu tidak punya akses ke sesi ini.'); return; }
      state.sessionDraft = {
        athleteId: s.athleteId,
        editingId: s.id,
        date: s.date,
        entries: JSON.parse(JSON.stringify(s.entries || {})),
        notes: s.notes || '',
        returnView: user.role === 'coach' ? 'athlete' : 'log'
      };
      state.view = 'session';
      state.modal = null;
      render();
      scrollTop();
      return;
    }
    case 'delete-session': {
      const s = getSessions().find(x => x.id === el.dataset.id);
      if (!s) return;
      const allowed = user.role === 'coach'
        ? (getUserById(s.athleteId) || {}).coachId === user.id
        : s.athleteId === user.id;
      if (!allowed) { toast('Kamu tidak punya akses ke sesi ini.'); return; }
      if (!confirm('Hapus sesi ini? Komentar pada sesi ini juga akan dihapus.')) return;
      saveSessions(getSessions().filter(x => x.id !== s.id));
      saveComments(getComments().filter(c => c.sessionId !== s.id));
      state.modal = null;
      toast('Sesi latihan dihapus.');
      render();
      return;
    }
    case 'cancel-session': {
      const draft = state.sessionDraft;
      state.sessionDraft = null;
      if (draft && draft.returnView === 'athlete' && draft.athleteId) {
        state.view = 'athlete';
        state.athleteId = draft.athleteId;
      } else {
        state.view = draft && draft.returnView ? draft.returnView : 'home';
      }
      render();
      scrollTop();
      return;
    }
    case 'new-athlete':
      if (user.role !== 'coach') return;
      state.modal = { type: 'athlete-form' };
      renderModal();
      return;
    case 'open-target': {
      if (user.role !== 'coach') return;
      const athlete = getUserById(el.dataset.athlete);
      if (!athlete || athlete.coachId !== user.id) return;
      state.modal = { type: 'target', athleteId: athlete.id };
      renderModal();
      return;
    }
    case 'open-package': {
      if (user.role !== 'coach') return;
      const athlete = getUserById(el.dataset.athlete);
      if (!athlete || athlete.coachId !== user.id) return;
      state.modal = { type: 'package', athleteId: athlete.id };
      renderModal();
      return;
    }
    case 'open-attendance': {
      if (user.role !== 'coach') return;
      const athlete = getUserById(el.dataset.athlete);
      if (!athlete || athlete.coachId !== user.id) return;
      attendancePhoto = null;
      state.modal = { type: 'attendance', athleteId: athlete.id };
      renderModal();
      return;
    }
    case 'open-photo': {
      if (user.role !== 'coach') return;
      const athlete = getUserById(el.dataset.athlete);
      if (!athlete || athlete.role !== 'athlete' || athlete.coachId !== user.id) return;
      state.modal = { type: 'photo', athleteId: athlete.id };
      renderModal();
      return;
    }
    case 'view-photo': {
      const id = el.dataset.id;
      if (!id) return;
      state.modal = { type: 'photo-view', photoId: id, caption: el.dataset.caption || 'Foto' };
      renderModal();
      return;
    }
    case 'pick-photo': {
      const input = document.getElementById(el.dataset.input || 'prof-photo-input');
      if (input) input.click();
      return;
    }
    case 'remove-photo': {
      const target = getUserById(el.dataset.owner || '');
      if (!target) return;
      const allowed = (user && user.id === target.id)
        || (user && user.role === 'coach' && target.role === 'athlete' && target.coachId === user.id);
      if (!allowed) return;
      if (!confirm('Hapus foto profil ' + target.name + '?')) return;
      removeUserPhoto(target);
      return;
    }
    case 'clear-attendance-photo':
      attendancePhoto = null;
      setAttendancePhotoPreview(null);
      return;
    case 'preset-meetings': {
      const input = document.getElementById('pkg-meetings');
      if (input) { input.value = el.dataset.value || ''; input.focus(); }
      return;
    }
    case 'preset-sessions': {
      const input = document.getElementById('att-sessions');
      if (input) { input.value = el.dataset.sessions || '1'; input.focus(); }
      return;
    }
    case 'delete-package': {
      if (user.role !== 'coach') return;
      const pkg = getPackages().find(p => p.id === el.dataset.id);
      if (!pkg) return;
      const athlete = getUserById(pkg.athleteId);
      if (!athlete || athlete.coachId !== user.id) return;
      if (!confirm('Hapus paket ' + pkg.meetings + ' pertemuan ini? Sisa kuota akan berkurang.')) return;
      savePackages(getPackages().filter(p => p.id !== pkg.id));
      toast('Paket dihapus.');
      render();
      return;
    }
    case 'delete-attendance': {
      if (user.role !== 'coach') return;
      const att = getAttendance().find(a => a.id === el.dataset.id);
      if (!att) return;
      const athlete = getUserById(att.athleteId);
      if (!athlete || athlete.coachId !== user.id) return;
      const sesi = attendanceSessions(att);
      if (!confirm('Hapus absensi tanggal ' + fmtDateShort(att.date) + ' (' + sesi + ' sesi)? Kuota akan bertambah ' + sesi + ' pertemuan.')) return;
      saveAttendance(getAttendance().filter(a => a.id !== att.id));
      if (att.photoId) cloudDeletePhoto(att.photoId);
      toast('Absensi dihapus.');
      render();
      return;
    }
    case 'edit-profile':
      state.modal = { type: 'profile' };
      renderModal();
      return;
    case 'export':
      if (user.role === 'coach') exportData();
      return;
    case 'import-trigger': {
      if (user.role !== 'coach') return;
      const input = document.getElementById('import-file');
      if (input) input.click();
      return;
    }
    case 'reset-filters':
      state.filters = { athleteId: '', from: '', to: '' };
      render();
      return;
  }
});

document.addEventListener('keydown', (e) => {

/* ================= proteksi tampilan =================
   Mencegah klik kanan dan pintasan "lihat sumber" sebagai penghalang sederhana.
   Catatan: ini hanya pengaman tampilan, bukan enkripsi. Kode yang dikirim ke
   browser tetap bisa diambil dengan cara lain oleh orang yang sangat paham teknis. */
document.addEventListener('contextmenu', (e) => {
  const t = e.target;
  const field = t && t.closest ? t.closest('input, textarea, [contenteditable="true"]') : null;
  if (field) return; // tetap izinkan klik kanan untuk tempel/salin di kolom isian
  e.preventDefault();
}, true);

document.addEventListener('keydown', (e) => {
  const k = String(e.key || '').toLowerCase();
  const mod = e.ctrlKey || e.metaKey;
  const block =
    e.key === 'F12' ||
    (mod && e.shiftKey && (k === 'i' || k === 'j' || k === 'c')) ||
    (mod && !e.shiftKey && (k === 'u' || k === 's'));
  if (block) {
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

document.addEventListener('change', (e) => {
  const toggle = e.target.closest ? e.target.closest('[data-activity-toggle]') : null;
  if (toggle) {
    const card = toggle.closest('.activity');
    if (card) {
      card.classList.toggle('active', toggle.checked);
      card.querySelectorAll('.activity-fields input').forEach(inp => { inp.disabled = !toggle.checked; });
      if (toggle.checked) {
        const first = card.querySelector('.activity-fields input');
        if (first) first.focus();
      }
    }
  }
  if (e.target && e.target.matches && e.target.matches('input[data-photo-input]')) {
    const input = e.target;
    const file = input.files && input.files[0];
    const kind = input.dataset.photoInput;
    const owner = input.dataset.owner || '';
    input.value = '';
    if (file) handlePhotoPick(kind, file, owner);
  }
  if (e.target && e.target.id === 'import-file') {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (file) importFile(file);
  }
});

document.addEventListener('submit', async (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  clearError(form);
  const type = form.dataset.form;
  try {
    if (type === 'setup') await handleSetup(form);
    else if (type === 'login') await handleLogin(form);
    else if (type === 'register') await handleRegister(form);
    else if (type === 'athlete') await handleAthleteCreate(form);
    else if (type === 'session') handleSessionSave(form);
    else if (type === 'comment') handleComment(form);
    else if (type === 'target') handleTargetSave(form);
    else if (type === 'package') handlePackageSave(form);
    else if (type === 'attendance') await handleAttendanceSave(form);
    else if (type === 'profile') handleProfileSave(form);
    else if (type === 'password') await handlePassword(form);
    else if (type === 'filters') handleFilters(form);
  } catch (err) {
    console.error(err);
    setError(form, 'Terjadi kesalahan. Coba lagi.');
  }
});

async function handleSetup(form){
  const fd = new FormData(form);
  const name = String(fd.get('name') || '').trim();
  const username = normalizeUsername(fd.get('username'));
  const pw = String(fd.get('password') || '');
  const pw2 = String(fd.get('password2') || '');
  if (name.length < 2) return setError(form, 'Nama minimal 2 karakter.');
  if (!isValidUsername(username)) return setError(form, 'Username 3–20 karakter, hanya huruf kecil, angka, titik, atau garis bawah.');
  if (pw.length < 6) return setError(form, 'Password minimal 6 karakter.');
  if (pw !== pw2) return setError(form, 'Konfirmasi password tidak sama.');
  const users = getUsers();
  if (users.some(u => u.username.toLowerCase() === username)) return setError(form, 'Username sudah dipakai.');
  setBusy(form, true, 'Membuat akun…');
  try {
    if (await cloudUsernameTaken(username)) return setError(form, 'Username sudah dipakai.');
    const coach = {
      id: uid(), name, username, pwHash: await hashPassword(pw),
      role: 'coach', createdAt: Date.now()
    };
    users.push(coach);
    saveUsers(users);
    localStorage.setItem(LS.auth, coach.id);
    state.view = 'home';
    state.loginTab = 'login';
    toast('Akun pelatih berhasil dibuat. Selamat datang!');
    render();
    await startCloud(coach.id, coach);
    await cloudWriteLookup(coach, coach.id);
  } finally {
    setBusy(form, false);
  }
}

async function handleLogin(form){
  const fd = new FormData(form);
  const username = normalizeUsername(fd.get('username'));
  const pw = String(fd.get('password') || '');
  if (!username || !pw) return setError(form, 'Isi username dan password.');
  setBusy(form, true, 'Memeriksa…');
  try {
    let user = getUsers().find(u => u.username.toLowerCase() === username);
    let wid = null;
    let found = null;
    if (!user || !(await verifyPassword(pw, user.pwHash))) {
      found = await cloudFindUser(username);
    }
    if (found && found.user && await verifyPassword(pw, found.user.pwHash)) {
      user = found.user;
      wid = found.wid;
      const users = getUsers();
      const index = users.findIndex(u => u.id === user.id || (u.username && u.username.toLowerCase() === username));
      if (index >= 0) users[index] = Object.assign({}, users[index], user);
      else users.push(user);
      saveUsers(users);
    }
    if (!user || !(await verifyPassword(pw, user.pwHash))) {
      if (!user && navigator.onLine === false) {
        return setError(form, 'Tidak ada koneksi internet. Login pertama di perangkat ini membutuhkan internet.');
      }
      if (!user && cloud.status === 'error') {
        return setError(form, 'Akun belum ada di perangkat ini dan cloud belum aktif. ' + (cloud.message || 'Periksa pengaturan Firebase.'));
      }
      return setError(form, 'Username atau password salah.');
    }
    wid = wid || cloudWorkspaceId(user);
    localStorage.setItem(LS.auth, user.id);
    state.view = 'home';
    state.modal = null;
    state.loginTab = 'login';
    state.filters = { athleteId: '', from: '', to: '' };
    toast('Selamat datang, ' + firstName(user.name) + '!');
    render();
    startCloud(wid, user);
  } finally {
    setBusy(form, false);
  }
}

function handleSessionSave(form){
  const user = currentUser();
  const draft = state.sessionDraft;
  if (!user || !draft) return;
  const athlete = getUserById(draft.athleteId);
  if (!athlete) return setError(form, 'Atlet tidak ditemukan.');
  if (user.role === 'athlete' && athlete.id !== user.id) return setError(form, 'Kamu tidak punya akses.');
  if (user.role === 'coach' && athlete.coachId !== user.id) return setError(form, 'Atlet ini bukan binaanmu.');

  const fd = new FormData(form);
  const date = String(fd.get('date') || '');
  if (!date) return setError(form, 'Tanggal latihan wajib diisi.');
  if (date > todayISO()) return setError(form, 'Tanggal tidak boleh di masa depan.');

  const entries = {};
  for (const a of ACTIVITIES) {
    if (!fd.get('act_' + a.key)) continue;
    const entry = {};
    let filled = 0;
    for (const f of a.fields) {
      const raw = fd.get(`entry_${a.key}_${f.key}`);
      if (raw === null || raw === '') {
        if (f.optional) continue;
        return setError(form, `Isi ${f.label.toLowerCase()} untuk ${a.name.toLowerCase()} dengan benar (lebih dari 0).`);
      }
      const num = Number(raw);
      if (!isFinite(num) || num <= 0) {
        return setError(form, `Isi ${f.label.toLowerCase()} untuk ${a.name.toLowerCase()} dengan benar (lebih dari 0).`);
      }
      entry[f.key] = num;
      filled++;
    }
    if (!filled) {
      return setError(form, `Isi minimal satu angka untuk ${a.name.toLowerCase()}, atau hapus centangnya.`);
    }
    entries[a.key] = entry;
  }
  if (!Object.keys(entries).length) return setError(form, 'Centang minimal satu jenis latihan yang dilakukan.');
  const notes = String(fd.get('notes') || '').trim();

  const sessions = getSessions();
  if (draft.editingId) {
    const s = sessions.find(x => x.id === draft.editingId);
    if (!s) return setError(form, 'Sesi tidak ditemukan.');
    s.date = date;
    s.entries = entries;
    s.notes = notes;
    s.updatedAt = Date.now();
  } else {
    sessions.push({
      id: uid(), athleteId: draft.athleteId, date, entries, notes,
      createdBy: user.id, createdAt: Date.now()
    });
  }
  saveSessions(sessions);
  toast(draft.editingId ? 'Sesi latihan diperbarui.' : 'Sesi latihan tersimpan.');

  const back = draft.returnView;
  const backAthlete = draft.athleteId;
  state.sessionDraft = null;
  if (back === 'athlete' && backAthlete) {
    state.view = 'athlete';
    state.athleteId = backAthlete;
  } else {
    state.view = back || 'home';
  }
  render();
  scrollTop();
}

function handlePackageSave(form){

  const fd = new FormData(form);
  const athleteId = String(fd.get('athleteId') || '');
  const athlete = getUserById(athleteId);
  if (!athlete || athlete.coachId !== user.id) return setError(form, 'Atlet tidak ditemukan.');
  const meetings = Number(fd.get('meetings'));
  if (!isFinite(meetings) || !Number.isInteger(meetings) || meetings <= 0) {
    return setError(form, 'Jumlah pertemuan harus angka bulat lebih dari 0.');
  }
  if (meetings > 1000) return setError(form, 'Jumlah pertemuan terlalu banyak (maksimal 1000).');
  const paidAt = String(fd.get('paidAt') || '') || todayISO();
  if (paidAt > todayISO()) return setError(form, 'Tanggal pembayaran tidak boleh di masa depan.');
  const amountRaw = String(fd.get('amount') || '').trim();
  let amount = null;
  if (amountRaw !== '') {
    const n = Number(amountRaw);
    if (!isFinite(n) || n < 0) return setError(form, 'Nominal pembayaran tidak valid.');
    amount = n > 0 ? n : null;
  }
  const note = String(fd.get('note') || '').trim().slice(0, 120);
  const packages = getPackages();
  packages.push({
    id: uid(), athleteId, coachId: user.id, meetings, amount, paidAt, note, createdAt: Date.now()
  });

  state.modal = null;
  render();

async function handlePassword(form){
  const user = currentUser();
  if (!user) return;
  const fd = new FormData(form);
  const oldPw = String(fd.get('oldPassword') || '');
  const newPw = String(fd.get('newPassword') || '');
  const newPw2 = String(fd.get('newPassword2') || '');
  if (!(await verifyPassword(oldPw, user.pwHash))) return setError(form, 'Password lama salah.');
  if (newPw.length < 6) return setError(form, 'Password baru minimal 6 karakter.');
  if (newPw !== newPw2) return setError(form, 'Konfirmasi password baru tidak sama.');
  const users = getUsers();
  const index = users.findIndex(u => u.id === user.id);
  if (index < 0) return;
  users[index] = Object.assign({}, users[index], { pwHash: await hashPassword(newPw) });
  saveUsers(users);
  form.reset();
  toast('Password berhasil diperbarui.');
}

function handleFilters(form){
  const fd = new FormData(form);
  state.filters = {
    athleteId: String(fd.get('athleteId') || ''),
    from: String(fd.get('from') || ''),
    to: String(fd.get('to') || '')
  };
  render();
}

/* ================= backup ================= */
function exportData(){
  const data = {
    app: 'Shuhaib Archery', version: 2, exportedAt: new Date().toISOString(),
    users: getUsers(), sessions: getSessions(),
    comments: getComments(), targets: getTargets(),
    packages: getPackages(), attendance: getAttendance()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'shuhaib-archery-backup-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1200);
  toast('File cadangan diunduh.');
}

async function importFile(file){
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.users) || !Array.isArray(data.sessions)) {
      throw new Error('Format tidak valid');
    }
    if (!confirm('Impor data ini? Semua data yang ada saat ini akan diganti.')) return;
    stopCloud();
    try { localStorage.removeItem(LS.cloudWs); } catch (err) { /* abaikan */ }
    saveUsers(data.users);
    saveSessions(data.sessions);
    saveComments(Array.isArray(data.comments) ? data.comments : []);
    saveTargets(Array.isArray(data.targets) ? data.targets : []);
    savePackages(Array.isArray(data.packages) ? data.packages : []);
    saveAttendance(Array.isArray(data.attendance) ? data.attendance : []);
    localStorage.removeItem(LS.auth);
    state.view = 'home';
    state.modal = null;
    state.sessionDraft = null;
    state.athleteId = null;
    state.filters = { athleteId: '', from: '', to: '' };
    renderAuth();
    toast('Data berhasil diimpor. Silakan masuk kembali.');
  } catch (err) {
    alert('File tidak valid. Pastikan file cadangan Shuhaib Archery (.json).');
  }
}

/* ================= boot ================= */
window.addEventListener('storage', (e) => {
  if (e.key && e.key.indexOf('panahlatih_') === 0) boot();
});
window.addEventListener('online', () => {
  const user = currentUser();
  if (user) startCloud(cloudWorkspaceId(user), user);
});
window.addEventListener('offline', () => {
  if (cloud.started) setCloudStatus('offline');
});

function boot(){
  initCloud();
  const users = getUsers();
  if (!users.length) { renderSetup(); return; }
  const user = currentUser();
  if (user) {
    render();
    startCloud(cloudWorkspaceId(user), user);
  } else {
    renderAuth();
  }
}

boot();

</script>
