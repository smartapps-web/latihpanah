function handleSessionSave(form){
  const user = currentUser();
  const draft = state.sessionDraft;
  if (!user || !draft) return;
  const athlete = getUserById(draft.athleteId);
  if (!athlete) return setError(form, 'Atlet tidak ditemukan.');
  if (user.role === 'athlete' && athlete.id !== user.id) return setError(form, 'Kamu tidak punya akses.');
  if (user.role === 'coach' && athlete.coachId !== user.id) return setError(form, 'Atlet ini bukan binaanmu.');

  const fd = new FormData(form);
  const date = String(fd.get('date') || '');
  if (!date) return setError(form, 'Tanggal latihan wajib diisi.');
  if (date > todayISO()) return setError(form, 'Tanggal tidak boleh di masa depan.');

  const entries = {};
  for (const a of ACTIVITIES) {
    if (!fd.get('act_' + a.key)) continue;
    const entry = {};
    let filled = 0;
    for (const f of a.fields) {
      const raw = fd.get(`entry_${a.key}_${f.key}`);
      if (raw === null || raw === '') {
        if (f.optional) continue;
        return setError(form, `Isi ${f.label.toLowerCase()} untuk ${a.name.toLowerCase()} dengan benar (lebih dari 0).`);
      }
      const num = Number(raw);
      if (!isFinite(num) || num <= 0) {
        return setError(form, `Isi ${f.label.toLowerCase()} untuk ${a.name.toLowerCase()} dengan benar (lebih dari 0).`);
      }
      entry[f.key] = num;
      filled++;
    }
    if (!filled) {
      return setError(form, `Isi minimal satu angka untuk ${a.name.toLowerCase()}, atau hapus centangnya.`);
    }
    entries[a.key] = entry;
  }
  if (!Object.keys(entries).length) return setError(form, 'Centang minimal satu jenis latihan yang dilakukan.');
  const notes = String(fd.get('notes') || '').trim();

  const sessions = getSessions();
  if (draft.editingId) {
    const s = sessions.find(x => x.id === draft.editingId);
    if (!s) return setError(form, 'Sesi tidak ditemukan.');
    s.date = date;
    s.entries = entries;
    s.notes = notes;
    s.updatedAt = Date.now();
  } else {
    sessions.push({
      id: uid(), athleteId: draft.athleteId, date, entries, notes,
      createdBy: user.id, createdAt: Date.now()
    });
  }
  saveSessions(sessions);
  toast(draft.editingId ? 'Sesi latihan diperbarui.' : 'Sesi latihan tersimpan.');

  const back = draft.returnView;
  const backAthlete = draft.athleteId;
  state.sessionDraft = null;
  if (back === 'athlete' && backAthlete) {
    state.view = 'athlete';
    state.athleteId = backAthlete;
  } else {
    state.view = back || 'home';
  }
  render();
  scrollTop();
}

function handleComment(form){
  const user = currentUser();
  if (!user || user.role !== 'coach') return;
  const fd = new FormData(form);
  const sessionId = String(fd.get('sessionId') || '');
  const text = String(fd.get('text') || '').trim();
  const s = getSessions().find(x => x.id === sessionId);
  const athlete = s ? getUserById(s.athleteId) : null;
  if (!s || !athlete || athlete.coachId !== user.id) return;
  if (!text) return setError(form, 'Komentar tidak boleh kosong.');
  if (text.length > 1000) return setError(form, 'Komentar maksimal 1000 karakter.');
  const comments = getComments();
  comments.push({ id: uid(), sessionId, coachId: user.id, text, createdAt: Date.now() });
  saveComments(comments);
  toast('Komentar terkirim.');
  render();
}

function handleTargetSave(form){
  const user = currentUser();
  if (!user || user.role !== 'coach') return;
  const fd = new FormData(form);
  const athleteId = String(fd.get('athleteId') || '');
  const athlete = getUserById(athleteId);
  if (!athlete || athlete.coachId !== user.id) return setError(form, 'Atlet tidak ditemukan.');
  const items = {};
  for (const a of ACTIVITIES) {
    const entry = {};
    let has = false;
    for (const f of a.fields) {
      const raw = fd.get(`t_${a.key}_${f.key}`);
      if (raw === null || raw === '') continue;
      const num = Number(raw);
      if (!isFinite(num) || num <= 0) {
        return setError(form, `Isi ${f.label.toLowerCase()} ${a.name.toLowerCase()} dengan angka lebih dari 0.`);
      }
      entry[f.key] = num;
      has = true;
    }
    if (has) items[a.key] = entry;
  }
  if (!Object.keys(items).length) return setError(form, 'Isi minimal satu target latihan.');
  const note = String(fd.get('note') || '').trim();
  const targets = getTargets();
  targets.push({
    id: uid(), athleteId, coachId: user.id, items, note, createdAt: Date.now()
  });
  saveTargets(targets);
  state.modal = null;
  render();
  toast('Target latihan disimpan.');
}

function handlePackageSave(form){
  const user = currentUser();
  if (!user || user.role !== 'coach') return;
  const fd = new FormData(form);
  const athleteId = String(fd.get('athleteId') || '');
  const athlete = getUserById(athleteId);
  if (!athlete || athlete.coachId !== user.id) return setError(form, 'Atlet tidak ditemukan.');
  const meetings = Number(fd.get('meetings'));
  if (!isFinite(meetings) || !Number.isInteger(meetings) || meetings <= 0) {
    return setError(form, 'Jumlah pertemuan harus angka bulat lebih dari 0.');
  }
  if (meetings > 1000) return setError(form, 'Jumlah pertemuan terlalu banyak (maksimal 1000).');
  const paidAt = String(fd.get('paidAt') || '') || todayISO();
  if (paidAt > todayISO()) return setError(form, 'Tanggal pembayaran tidak boleh di masa depan.');
  const amountRaw = String(fd.get('amount') || '').trim();
  let amount = null;
  if (amountRaw !== '') {
    const n = Number(amountRaw);
    if (!isFinite(n) || n < 0) return setError(form, 'Nominal pembayaran tidak valid.');
    amount = n > 0 ? n : null;
  }
  const note = String(fd.get('note') || '').trim().slice(0, 120);
  const packages = getPackages();
  packages.push({
    id: uid(), athleteId, coachId: user.id, meetings, amount, paidAt, note, createdAt: Date.now()
  });
  savePackages(packages);
  state.modal = null;
  render();
  toast('Paket ' + meetings + ' pertemuan ditambahkan untuk ' + athlete.name + '.');
}

function handleAttendanceSave(form){
  const user = currentUser();
  if (!user || user.role !== 'coach') return;
  const fd = new FormData(form);
  const athleteId = String(fd.get('athleteId') || '');
  const athlete = getUserById(athleteId);
  if (!athlete || athlete.coachId !== user.id) return setError(form, 'Atlet tidak ditemukan.');
  const date = String(fd.get('date') || '') || todayISO();
  if (!date) return setError(form, 'Tanggal latihan wajib diisi.');
  if (date > todayISO()) return setError(form, 'Tanggal latihan tidak boleh di masa depan.');
  const sessionsRaw = String(fd.get('sessions') || '').trim();
  const sessions = Number(sessionsRaw);
  if (!Number.isInteger(sessions) || sessions < 1 || sessions > 12) {
    return setError(form, 'Jumlah sesi harus angka bulat 1–12.');
  }
  const note = String(fd.get('note') || '').trim().slice(0, 120);
  const attendance = getAttendance();
  attendance.push({
    id: uid(), athleteId, coachId: user.id, date, sessions, note, createdAt: Date.now()
  });
  saveAttendance(attendance);
  const q = quotaSummary(athleteId);
  state.modal = null;
  render();
  toast('Absensi ' + sessions + ' sesi (' + (sessions * 2) + ' jam) untuk ' + athlete.name + ' tersimpan. Sisa kuota: ' + formatNum(q.remaining) + ' pertemuan.');
}

function handleProfileSave(form){
  const user = currentUser();
  if (!user) return;
  const fd = new FormData(form);
  const name = String(fd.get('name') || '').trim();
  if (name.length < 2) return setError(form, 'Nama minimal 2 karakter.');
  if (name.length > 60) return setError(form, 'Nama maksimal 60 karakter.');
  let extra = {
    birthDate: user.birthDate || '',
    startDate: user.startDate || '',
    phone: user.phone || '',
    address: user.address || ''
  };
  if (user.role === 'athlete') {
    const parsed = readProfileExtra(fd);
    if (parsed.error) return setError(form, parsed.error);
    extra = parsed;
  }
  const users = getUsers();
  const index = users.findIndex(u => u.id === user.id);
  if (index < 0) return;
  users[index] = Object.assign({}, users[index], {
    name,
    birthDate: extra.birthDate,
    startDate: extra.startDate,
    phone: extra.phone,
    address: extra.address
  });
  saveUsers(users);
  state.modal = null;
  render();
  toast('Profil berhasil diperbarui.');
}

async function handlePassword(form){
  const user = currentUser();
  if (!user) return;
  const fd = new FormData(form);
  const oldPw = String(fd.get('oldPassword') || '');
  const newPw = String(fd.get('newPassword') || '');
  const newPw2 = String(fd.get('newPassword2') || '');
  if (!(await verifyPassword(oldPw, user.pwHash))) return setError(form, 'Password lama salah.');
  if (newPw.length < 6) return setError(form, 'Password baru minimal 6 karakter.');
  if (newPw !== newPw2) return setError(form, 'Konfirmasi password baru tidak sama.');
  const users = getUsers();
  const index = users.findIndex(u => u.id === user.id);
  if (index < 0) return;
  users[index] = Object.assign({}, users[index], { pwHash: await hashPassword(newPw) });
  saveUsers(users);
  form.reset();
  toast('Password berhasil diperbarui.');
}

function handleFilters(form){
  const fd = new FormData(form);
  state.filters = {
    athleteId: String(fd.get('athleteId') || ''),
    from: String(fd.get('from') || ''),
    to: String(fd.get('to') || '')
  };
  render();
}

/* ================= backup ================= */
function exportData(){
  const data = {
    app: 'PanahLatih', version: 2, exportedAt: new Date().toISOString(),
    users: getUsers(), sessions: getSessions(),
    comments: getComments(), targets: getTargets(),
    packages: getPackages(), attendance: getAttendance()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'panahlatih-backup-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1200);
  toast('File cadangan diunduh.');
}

async function importFile(file){
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.users) || !Array.isArray(data.sessions)) {
      throw new Error('Format tidak valid');
    }
    if (!confirm('Impor data ini? Semua data yang ada saat ini akan diganti.')) return;
    stopCloud();
    try { localStorage.removeItem(LS.cloudWs); } catch (err) { /* abaikan */ }
    saveUsers(data.users);
    saveSessions(data.sessions);
    saveComments(Array.isArray(data.comments) ? data.comments : []);
    saveTargets(Array.isArray(data.targets) ? data.targets : []);
    savePackages(Array.isArray(data.packages) ? data.packages : []);
    saveAttendance(Array.isArray(data.attendance) ? data.attendance : []);
    localStorage.removeItem(LS.auth);
    state.view = 'home';
    state.modal = null;
    state.sessionDraft = null;
    state.athleteId = null;
    state.filters = { athleteId: '', from: '', to: '' };
    renderAuth();
    toast('Data berhasil diimpor. Silakan masuk kembali.');
  } catch (err) {
    alert('File tidak valid. Pastikan file cadangan PanahLatih (.json).');
  }
}

/* ================= boot ================= */
window.addEventListener('storage', (e) => {
  if (e.key && e.key.indexOf('panahlatih_') === 0) boot();
});
window.addEventListener('online', () => {
  const user = currentUser();
  if (user) startCloud(cloudWorkspaceId(user), user);
});
window.addEventListener('offline', () => {
  if (cloud.started) setCloudStatus('offline');
});

function boot(){
  initCloud();
  const users = getUsers();
  if (!users.length) { renderSetup(); return; }
  const user = currentUser();
  if (user) {
    render();
    startCloud(cloudWorkspaceId(user), user);
  } else {
    renderAuth();
  }
}

boot();
